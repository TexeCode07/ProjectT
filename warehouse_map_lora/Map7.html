
<!DOCTYPE html>
<html>
<head>
   <title>OpenStreetMap with Markers from CSV</title>
   <!-- Include Leaflet CSS and JavaScript -->
   <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
   <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
   <style>
       /* Set the size of the map */
       #map {
           height: 1500px;
           width: 100%;
       }
   </style>
</head>
<body>
   <!-- The div element for the map -->
   <div id="map"></div>

   <script>
       var map = L.map('map').setView([34.052396, -118.365786], 17); // Create a Leaflet map centered at specific coordinates

       var markers = {}; // To store markers

       // Add OpenStreetMap tile layer to the map
       L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
           attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
           maxZoom: 23
       }).addTo(map);

       // Fetch data from the PHP script that serves the CSV file
       fetch('csvmap.php'); // Replace 'csvmap.php' with your PHP script URL

       function fetchAndUpdateMarkers() {
           // Fetch the CSV file with a timestamp to avoid caching
           fetch('door.csv?' + new Date().getTime())
               .then(response => response.text())
               .then(data => {
                   var lines = data.split('\n'); // Split the CSV data into lines

                   lines.forEach(line => {
                       var parts = line.split(',');
                       var doorName = parts[0].trim(); // Extract door name
                       var coordinates = parts.slice(1).join(',').trim().replace(/[\[\]"']/g, ''); // Extract coordinates and status
                       var [latitude, longitude, status] = coordinates.split(',').map(coord => parseFloat(coord.trim()));

                       // Check the status to decide whether to show or remove the marker
                       if (status === 1) {
                           if (markers[doorName]) {
                               markers[doorName].setLatLng([latitude, longitude]); // Update marker position if exists
                           } else {
                               var marker = L.marker([latitude, longitude]).addTo(map); // Create a new marker if not exists
                               markers[doorName] = marker; // Store marker reference
                               marker.on('click', function() {
                                   // Open Google Maps with marker's location on click
                                   var url = 'https://maps.google.com/?q=' + this.getLatLng().lat + ',' + this.getLatLng().lng;
                                   window.open(url, '_blank');
                               });
                           }
                       } else {
                           // Remove marker if status is not '1'
                           if (markers[doorName]) {
                               map.removeLayer(markers[doorName]);
                               delete markers[doorName];
                           }
                       }
                   });
               })
               .catch(error => {
                   console.error('Error fetching the CSV file:', error);
               });
       }

       // Initially fetch and update markers
       fetchAndUpdateMarkers();

       // Update markers every 5 seconds
       setInterval(fetchAndUpdateMarkers, 5000);
   </script>
</body>
</html>
